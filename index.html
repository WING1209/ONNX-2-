<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>【WING】-stem separation- Ver.1.14</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px;
  font-family: -apple-system, BlinkMacSystemFont, "Hiragino Maru Gothic ProN", "Rounded Mplus 1c", "Segoe UI", Roboto, sans-serif;
  background-color: #fffbeb;
  background-image:
    radial-gradient(#fde047 2.2px, transparent 2.2px),
    radial-gradient(#f472b6 2px, #fffbeb 2px);
  background-size: 28px 28px;
  background-position: 0 0, 14px 14px;
  color: #1e1b4b;
  min-height: 100vh;
}
.box {
  max-width: 480px;
  margin: 0 auto;
  background: rgba(255, 255, 255, 0.94);
  border: 3px solid #1e1b4b;
  border-radius: 26px;
  padding: 18px 16px 22px;
  box-shadow: 7px 7px 0px #1e1b4b;
}
.app-title {
  text-align: center;
  font-size: 1.62rem;
  line-height: 1.25;
  font-weight: 900;
  letter-spacing: 0.02em;
  margin: 0 0 12px;
  padding: 16px 12px;
  border-radius: 20px;
  border: 3.5px solid #1e1b4b;
  background: linear-gradient(120deg, #ff2a85 0%, #ff8a00 28%, #ffe600 52%, #00d2ff 78%, #9b5de5 100%);
  box-shadow: 5px 5px 0px #1e1b4b;
  transform: rotate(-1.2deg);
}
.title-rainbow {
  display: inline-block;
  background: linear-gradient(90deg, #ffffff 0%, #fff7ed 50%, #fef08a 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: #1e1b4b;
  -webkit-text-stroke: 1.2px #1e1b4b;
  paint-order: stroke fill;
  text-shadow: 2px 2px 0px rgba(255, 255, 255, 0.85);
}
.title-accent {
  display: inline-block;
  margin-top: 2px;
  padding: 2px 10px;
  border-radius: 999px;
  background: #1e1b4b;
  font-size: 1.18rem;
  font-weight: 900;
  letter-spacing: 0.03em;
  background-image: linear-gradient(90deg, #ff5ca8, #ffd166, #06d6a0, #4cc9f0, #c77dff);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.title-version {
  display: inline-block;
  margin-top: 6px;
  padding: 2px 12px;
  border-radius: 999px;
  background: #1e1b4b;
  color: #fef08a;
  font-size: 0.88rem;
  font-weight: 900;
  letter-spacing: 0.06em;
  border: 2px solid #ffffff;
}
.auto-save-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin: 0 0 14px;
  padding: 10px 14px;
  border-radius: 16px;
  background: #f3e8ff;
  border: 2.5px solid #1e1b4b;
  box-shadow: 3px 3px 0px #1e1b4b;
}
.auto-save-label {
  font-size: 0.9rem;
  font-weight: 900;
  color: #1e1b4b;
}
.auto-save-btn {
  padding: 7px 14px;
  border-radius: 999px;
  border: 2px solid #1e1b4b;
  box-shadow: 2px 2px 0px #1e1b4b;
  font-size: 0.85rem;
  font-weight: 900;
  cursor: pointer;
  transition: transform 0.1s ease, background 0.15s ease;
}
.auto-save-btn.is-on {
  background: #4ade80;
  color: #1e1b4b;
}
.auto-save-btn.is-off {
  background: #e2e8f0;
  color: #475569;
}
.auto-save-btn:active {
  transform: translate(2px, 2px);
  box-shadow: 0px 0px 0px #1e1b4b;
}
.file-label {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  min-height: 92px;
  padding: 18px 14px;
  border: 3px dashed #ff4d8d;
  border-radius: 20px;
  background: #fff0f6;
  color: #1e1b4b;
  font-size: 1.05rem;
  font-weight: 800;
  text-align: center;
  cursor: pointer;
  box-shadow: 4px 4px 0px #ff9ebb;
  transition: transform 0.12s ease, background 0.15s ease, box-shadow 0.12s ease;
}
.file-label:hover {
  background: #ffe3ee;
}
.file-label:active {
  background: #ffd1e3;
  transform: translate(3px, 3px);
  box-shadow: 1px 1px 0px #ff9ebb;
}
.file-sub {
  font-size: 0.8rem;
  font-weight: 600;
  color: #6b21a8;
  background: #f3e8ff;
  padding: 3px 10px;
  border-radius: 999px;
}
input[type="file"] {
  display: none;
}
.btn {
  display: block;
  width: 100%;
  padding: 16px;
  margin-top: 14px;
  font-size: 1.08rem;
  font-weight: 900;
  letter-spacing: 0.03em;
  border: 3px solid #1e1b4b;
  border-radius: 18px;
  background: linear-gradient(90deg, #38bdf8 0%, #4ade80 100%);
  color: #1e1b4b;
  box-shadow: 5px 5px 0px #1e1b4b;
  cursor: pointer;
  transition: transform 0.1s ease, box-shadow 0.1s ease;
}
.btn:hover:not(:disabled) {
  filter: brightness(1.03);
}
.btn:active:not(:disabled) {
  transform: translate(4px, 4px);
  box-shadow: 1px 1px 0px #1e1b4b;
}
.btn:disabled {
  background: #e2e8f0;
  color: #64748b;
  border-color: #94a3b8;
  box-shadow: 3px 3px 0px #cbd5e1;
  cursor: not-allowed;
}
.status {
  margin-top: 14px;
  padding: 11px 14px;
  border-radius: 16px;
  background: #fef9c3;
  border: 2.5px solid #1e1b4b;
  box-shadow: 3px 3px 0px #1e1b4b;
  font-size: 0.9rem;
  font-weight: 700;
  color: #1e1b4b;
  word-break: break-all;
}
#results {
  margin-top: 16px;
  display: grid;
  gap: 12px;
}
.stem {
  padding: 14px 16px;
  border-radius: 18px;
  background: #f0f9ff;
  border: 2.5px solid #1e1b4b;
  border-left: 9px solid #0ea5e9;
  box-shadow: 4px 4px 0px #1e1b4b;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}
.stem-name {
  font-weight: 900;
  font-size: 0.98rem;
  color: #1e1b4b;
}
.dl-btn {
  color: #ffffff;
  background: linear-gradient(90deg, #ff4d8d, #fb923c);
  border: 2px solid #1e1b4b;
  box-shadow: 3px 3px 0px #1e1b4b;
  font-size: 0.88rem;
  font-weight: 800;
  padding: 9px 14px;
  border-radius: 12px;
  white-space: nowrap;
  cursor: pointer;
  transition: transform 0.1s ease, box-shadow 0.1s ease;
}
.dl-btn:active:not(:disabled) {
  transform: translate(2px, 2px);
  box-shadow: 1px 1px 0px #1e1b4b;
}
.dl-btn:disabled {
  opacity: 0.45;
  pointer-events: none;
  background: #cbd5e1;
  color: #475569;
  border-color: #94a3b8;
  box-shadow: none;
}
</style>
</head>
<body>
<div class="box" id="app">
  <header class="app-title">
    <span class="title-rainbow">【WING】</span><br>
    <span class="title-accent">-stem separation-</span><br>
    <span class="title-version">Ver.1.14</span>
  </header>
  <div class="auto-save-bar">
    <span class="auto-save-label">💾 完了後の自動保存</span>
    <button id="autoSaveToggle" type="button" class="auto-save-btn is-on" aria-pressed="true">ON</button>
  </div>
  <label for="audioFile" class="file-label" id="fileLabel">
    <span>♫♪ 音源ファイルを選択 (タップ) ✨</span>
    <span class="file-sub" id="fileSub">対応形式: MP3 / WAV (44100Hz・ステレオ)</span>
  </label>
  <input type="file" id="audioFile" accept=".mp3, .wav, audio/mpeg, audio/wav">
  <button id="runBtn" class="btn" disabled>🎸 伴奏抽出を実行！</button>
  <div id="status" class="status">MP3 または WAVファイルを選択してください。</div>
  <div id="results">
    <div class="stem">
      <span class="stem-name">🎸 伴奏 (Accompaniment)</span>
      <button id="dl-accompaniment" class="dl-btn" disabled>音声 保存</button>
    </div>
  </div>
</div>
<script type="module" src="app.js?v=1.13"></script>
</body>
</html>
